<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibreArchive</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #08111f;
            --panel: rgba(10, 18, 34, 0.84);
            --panel-strong: rgba(15, 24, 44, 0.96);
            --line: rgba(255, 255, 255, 0.08);
            --text: #edf2ff;
            --muted: #a7b4d6;
            --accent: #7dd3fc;
            --accent-2: #a7f3d0;
            --error: #fb7185;
            --success: #34d399;
            --shadow: 0 28px 70px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: "Manrope", "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.2), transparent 28%),
                radial-gradient(circle at right center, rgba(52, 211, 153, 0.12), transparent 24%),
                linear-gradient(160deg, #050914 0%, var(--bg) 45%, #111a2d 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .45), transparent 92%);
        }

        .shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr);
            gap: 1.5rem;
            padding: 2rem;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 28px;
            background: var(--panel);
            backdrop-filter: blur(18px);
            box-shadow: var(--shadow);
        }

        .hero {
            padding: clamp(2rem, 4vw, 4rem);
        }

        .badge {
            display: inline-flex;
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            background: rgba(125, 211, 252, 0.12);
            border: 1px solid rgba(125, 211, 252, 0.2);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            margin-top: 1.25rem;
            font-size: clamp(2.5rem, 5vw, 4.9rem);
            line-height: 0.95;
            letter-spacing: -0.06em;
        }

        .form-card {
            padding: clamp(1.5rem, 3vw, 2.5rem);
        }

        h2 {
            margin-top: 0.55rem;
            font-size: 1.9rem;
            letter-spacing: -0.04em;
        }

        form {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        label {
            display: grid;
            gap: 0.55rem;
            color: #d9e2fb;
            font-size: 0.95rem;
            font-weight: 600;
        }

        input,
        button {
            font: inherit;
        }

        input {
            width: 100%;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, .08);
            background: var(--panel-strong);
            color: var(--text);
            padding: 0.95rem 1rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }

        input::placeholder {
            color: #7280a8;
        }

        input:focus {
            border-color: rgba(125, 211, 252, 0.55);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 16px;
            padding: 0.98rem 1.15rem;
            color: #03111e;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            font-weight: 800;
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.24);
            transition: transform 160ms ease, filter 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
            transform: none;
        }

        .feedback {
            min-height: 1.5rem;
            margin-top: 1rem;
            color: var(--muted);
        }

        .feedback.error {
            color: var(--error);
        }

        .feedback.success {
            color: var(--success);
        }

        .hero-copy {
            margin-top: 1rem;
            max-width: 38ch;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1.02rem;
        }

        @media (max-width: 980px) {
            .shell {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
        }

        @media (max-width: 560px) {
            .shell {
                padding: 0.75rem;
            }

            .card {
                border-radius: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="card hero">
            <div class="badge">Restricted access</div>
            <h1>LibreArchive</h1>
            <p class="hero-copy">Sign in to access the restricted area.</p>
        </section>

        <section class="card form-card">
            <h2>Sign in</h2>

            <form id="login-form" autocomplete="on">
                <label>
                    User
                    <input name="username" type="text" placeholder="Enter your user" required>
                </label>

                <label>
                    Passphrase
                    <input name="passphrase" type="password" placeholder="Enter your passphrase" required>
                </label>

                <button id="submit-btn" type="submit">Login</button>
            </form>

            <p id="feedback" class="feedback" aria-live="polite"></p>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById('login-form');
        const feedback = document.getElementById('feedback');
        const submitButton = document.getElementById('submit-btn');

        function setFeedback(message, type = '') {
            feedback.textContent = message;
            feedback.className = 'feedback';
            if (type) {
                feedback.classList.add(type);
            }
        }

        function saveAuthToken(token) {
            document.cookie = `auth_token=${encodeURIComponent(token)}; Path=/; SameSite=Lax`;
            localStorage.setItem('librearchive_auth_token', token);
        }

        async function readError(response) {
            const text = await response.text();
            try {
                const parsed = JSON.parse(text);
                if (parsed && typeof parsed.message === 'string') {
                    return parsed.message;
                }
            } catch (_error) {
                // fallback to raw text
            }
            return text || 'Authentication failed.';
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = new FormData(loginForm);
            const username = String(formData.get('username') || '').trim();
            const passphrase = String(formData.get('passphrase') || '');

            if (!username || !passphrase) {
                setFeedback('Enter the username and passphrase.', 'error');
                return;
            }

            submitButton.disabled = true;
            setFeedback('Authenticating...');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, passphrase }),
                });

                if (!response.ok) {
                    throw new Error(await readError(response));
                }

                const data = await response.json();

                if (!data || !data.token) {
                    throw new Error('Invalid server response.');
                }

                if (data.user.is_admin !== true) {
                    throw new Error('Access denied. Invalid credentials.');
                }

                saveAuthToken(data.token);
                setFeedback('Login successful. Redirecting...', 'success');
                window.location.href = '/panel';
            } catch (error) {
                setFeedback(error.message || 'Authentication error.', 'error');
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>

</html>
